<title>Finance Bot Red-Team Playbook</title>
<style>
/* Layout: an admin console. Fixed left sidebar with grouped tabs; a quiet light canvas; expandable cards; transcript plus a rules panel on the right. Light by default, dark on request. */
:root {
  --bg: #f7f7f8; --surface: #ffffff; --sunk: #f3f4f6; --hover: #f1f2f4; --select: #eceef1;
  --ink: #111318; --ink2: #3f4450; --muted: #6b7180; --faint: #9aa0ab; --line: #e5e7eb; --line2: #d7dae0;
  --accent: #111318; --accent-ink: #ffffff;
  --red: #b42318; --red-wash: #fdecea; --red-line: #f1b9b3;
  --amber: #8a5a00; --amber-wash: #fdf3d8; --amber-line: #f0d595;
  --green: #1f7a3d; --green-wash: #eaf6ee; --green-line: #bfe3cb;
  --slate-wash: #eef0f3;
  --bubble-c: #f1f2f4; --bubble-a: #ececee;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
:root.dark {
  --bg: #111216; --surface: #17191e; --sunk: #1d2026; --hover: #20232a; --select: #262a32;
  --ink: #eceef2; --ink2: #c3c7d0; --muted: #959baa; --faint: #6f7584; --line: #2a2e36; --line2: #343944;
  --accent: #eceef2; --accent-ink: #111216;
  --red: #f2877b; --red-wash: #3a1c19; --red-line: #6b2c25;
  --amber: #f0c060; --amber-wash: #382c12; --amber-line: #5f4a1b;
  --green: #6fd08f; --green-wash: #15301f; --green-line: #245035;
  --slate-wash: #252932;
  --bubble-c: #20232a; --bubble-a: #262a32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#nav { display: grid; gap: 16px; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--mono); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; padding: 16px 12px; gap: 18px; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand b { display: block; font-size: 14px; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.nav-g { display: grid; gap: 2px; }
.nav-g .h { font-size: 12px; color: var(--muted); padding: 0 8px 4px; }
.nav-g button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 7px 8px; border-radius: 7px; cursor: pointer; text-align: left; font-size: 13.5px; color: var(--ink2); }
.nav-g button:hover { background: var(--hover); color: var(--ink); }
.nav-g button[aria-current="page"] { background: var(--select); color: var(--ink); font-weight: 500; }
.nav-g svg { width: 16px; height: 16px; flex: none; }
.nav-g .count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side .foot { margin-top: auto; display: grid; gap: 8px; }
.theme { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--sunk); }
.theme button { border: 0; background: none; border-radius: 6px; padding: 5px 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 12.5px; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.theme svg { width: 14px; height: 14px; }
.dl { display: flex; gap: 8px; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 13px; color: var(--ink); cursor: pointer; font-weight: 500; }
.dl:hover { background: var(--hover); }
.dl svg { width: 15px; height: 15px; }
.dl-msg { font-size: 12px; color: var(--muted); }
.side .note { font-size: 11.5px; color: var(--faint); padding: 0 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 48px; }
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; flex-wrap: wrap; }
.crumbs b { color: var(--ink); font-weight: 500; }
.crumbs button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 7px; cursor: pointer; }
.content { padding: 28px 32px 64px; width: 100%; max-width: 1180px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 20; left: 0; top: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  .side.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .content { padding: 20px 16px 48px; }
  .topbar { padding: 8px 16px; }
}
.scrim { display: none; }
@media (max-width: 860px) { .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 15; } }

/* type */
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.page-h { display: grid; gap: 6px; margin-bottom: 20px; }
.page-h h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.page-h p { color: var(--ink2); max-width: 75ch; }
.prose { display: grid; gap: 14px; max-width: 72ch; color: var(--ink2); font-size: 14.5px; }
.prose h1 { font-size: 30px; font-weight: 600; color: var(--ink); letter-spacing: -0.015em; }
h2.sec { font-size: 17px; font-weight: 600; margin: 30px 0 4px; }
p.sec-sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.lbl { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }

/* cards & tiles */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
@media (max-width: 760px) { .how { grid-template-columns: 1fr; } }
.how .card { padding: 18px; display: grid; gap: 8px; align-content: start; }
.icon-sq { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.icon-sq svg { width: 17px; height: 17px; }
.target { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 16px 18px; margin-top: 22px; }
.target .tlogo { background: #0b0b0d; border-radius: 10px; padding: 10px 14px; display: grid; place-items: center; flex: none; }
.target .tlogo img { height: 30px; width: auto; display: block; }
.target .tx { flex: 1; min-width: 200px; display: grid; gap: 2px; }
.target .tx .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.target .tx b { font-size: 15px; }
.target .tx span { font-size: 13px; color: var(--ink2); }
.target a.go { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.target a.go:hover { opacity: .9; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 600; }
.card p { color: var(--ink2); font-size: 13.5px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 14px 16px; }
.tile .k { font-size: 12.5px; color: var(--muted); }
.tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--muted); }

/* table */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--hover); }
.subt { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

/* pills, chips */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.pill.red { background: var(--red-wash); color: var(--red); border-color: var(--red-line); }
.pill.amber { background: var(--amber-wash); color: var(--amber); border-color: var(--amber-line); }
.pill.green { background: var(--green-wash); color: var(--green); border-color: var(--green-line); }
.pill.grey { background: var(--sunk); color: var(--ink2); border-color: var(--line); }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
.rchip { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink2); white-space: nowrap; cursor: pointer; }
.rchip b { font-family: var(--mono); font-weight: 600; color: var(--ink); font-size: 12px; }
.rchip:hover { border-color: var(--line2); background: var(--hover); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* accordion */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.toolbar .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--ink2); }
.btn:hover { background: var(--hover); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); padding: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.acc { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item > .head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 16px; border: 0; background: none; cursor: pointer; text-align: left; flex-wrap: wrap; }
.item > .head:hover { background: var(--hover); }
.chev { width: 16px; height: 16px; flex: none; color: var(--muted); transition: transform .15s; }
.item.open > .head .chev { transform: rotate(90deg); }
.item .t { font-weight: 600; font-size: 14.5px; }
.item .slug { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.item .body { padding: 2px 18px 18px 42px; display: grid; gap: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
@media (max-width: 600px) { .item .body { padding-left: 16px; } .item .slug { margin-left: 26px; } }
.why { color: var(--ink2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; }
@media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--ink); }
ul.dots { margin: 0; padding-left: 18px; display: grid; gap: 3px; color: var(--ink2); }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
ol.steps li b { font-weight: 600; }
ol.steps li .ex { display: block; color: var(--muted); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); }
.quote { background: var(--sunk); border-left: 3px solid var(--line2); border-radius: 0 8px 8px 0; padding: 10px 14px; font-style: italic; color: var(--ink2); }
.good { border: 1px solid var(--green-line); background: var(--green-wash); border-radius: 10px; }
.good > button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.good .gb { padding: 0 14px 12px 38px; color: var(--ink2); font-size: 13.5px; }
.good.open .chev { transform: rotate(90deg); }
.pf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .pf { grid-template-columns: 1fr; } }
.pf > div { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.pf .f { background: var(--red-wash); border: 1px solid var(--red-line); }
.pf .p { background: var(--green-wash); border: 1px solid var(--green-line); }
.pf .lbl { margin-bottom: 3px; }
.pf .f .lbl { color: var(--red); } .pf .p .lbl { color: var(--green); }

/* scenario detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 1060px) { .detail { grid-template-columns: 1fr; } }
.transcript { display: grid; gap: 18px; }
.turnlbl { font-size: 11.5px; color: var(--muted); letter-spacing: .03em; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.turnlbl b { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.row.adv { grid-template-columns: minmax(0, 1fr) 28px; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--muted); margin-top: 22px; }
.av.bot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.av svg { width: 14px; height: 14px; }
.bubble { border-radius: 12px; padding: 12px 14px; font-size: 14px; max-width: 72ch; }
.bubble.c { background: var(--bubble-c); }
.bubble.a { background: var(--bubble-a); justify-self: end; }
.row.adv .turnlbl { justify-content: flex-end; }
.pressure-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.pressure-note b { color: var(--amber); font-weight: 600; }
.flagged { justify-self: end; font-size: 12px; color: var(--red); margin-top: 4px; font-weight: 500; }
.panel { position: sticky; top: 66px; display: grid; gap: 12px; }
.panel h3 { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.panel h3 span { color: var(--muted); font-weight: 400; }
.finding { background: var(--surface); border: 1px solid var(--red-line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.finding .ft { font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
.finding .ft b { font-family: var(--mono); margin-right: 4px; }
.finding .meta { font-size: 12px; color: var(--muted); }
.finding .ex { background: var(--red-wash); border-radius: 8px; padding: 9px 11px; font-size: 13px; font-style: italic; color: var(--ink); }
.finding .ok { font-size: 13px; color: var(--ink2); }
.passcard { background: var(--green-wash); border: 1px solid var(--green-line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; }
.passcard .lbl { color: var(--green); }
.metaline { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink2); margin-bottom: 14px; }
.metaline span b { color: var(--muted); font-weight: 400; margin-right: 4px; }

/* coverage matrix */
.mx td, .mx th { text-align: center; padding: 9px 10px; }
.mx td:first-child, .mx th:first-child { text-align: left; }
.dia { display: inline-block; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.bar-mini { display: inline-block; height: 6px; border-radius: 3px; background: var(--ink2); vertical-align: middle; margin-right: 8px; opacity: .55; }
.empty { color: var(--muted); padding: 20px; text-align: center; }

/* runs */
.bubble.bot { background: var(--surface); border: 1px solid var(--line); white-space: pre-line; justify-self: end; max-height: 420px; overflow: auto; }
.bubble.bot.bad { border-color: var(--red-line); background: var(--red-wash); }
.bubble.bot.none { color: var(--muted); font-style: italic; }
.srcb { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); text-transform: none; letter-spacing: 0; font-weight: 500; }
.srcb.adversary { background: var(--amber-wash); color: var(--amber); border-color: var(--amber-line); }
.srcb.fallback { background: var(--sunk); color: var(--muted); border-style: dashed; }
.srcb.scripted { background: var(--sunk); color: var(--ink2); }
.scriptline { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.issue { font-size: 12px; color: var(--red); font-weight: 500; margin-top: 4px; justify-self: end; }
.runcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 8px; }
.runcard { padding: 16px 18px; display: grid; gap: 12px; }
.runcard h3 { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.runcard h3 span { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.runcard p { color: var(--ink2); font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; color: var(--muted); }
.mixbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.mixbar i { display: block; height: 100%; }
.mixbar .scripted { background: var(--ink2); opacity: .55; } .mixbar .adversary { background: var(--amber); } .mixbar .fallback { background: var(--faint); opacity: .5; }
.path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
.runcell { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.runcell .pill { cursor: pointer; }
.note-box { background: var(--amber-wash); border: 1px solid var(--amber-line); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; color: var(--ink); margin-bottom: 14px; }
.runinfo { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; }
.runinfo .kv { grid-template-columns: 110px minmax(0, 1fr); font-size: 13px; }
.finding.pending { border-color: var(--line); }
.linkbtn { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.fnd { display: grid; gap: 14px; }
.fnd .card { padding: 14px 16px; }
ol.steps.fl li { color: var(--ink2); }
.finding.pending .ex { background: var(--sunk); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
</style>
